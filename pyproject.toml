[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-noise"
version = "0.1.0"
description = "Noise detection and pairwise noise interaction analysis for RAG."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
